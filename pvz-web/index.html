<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants vs Zombies - Web Clone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- UI Layer -->
        <div id="ui-layer">
            <div id="top-bar">
                <div id="sun-bank">
                    <span id="sun-count">50</span>
                </div>
                <div id="seed-bank">
                    <!-- Seed cards will be dynamically injected here -->
                </div>
                <div id="shovel-bank">
                    <div id="shovel" class="tool-card">铲子</div>
                </div>
            </div>
            <!-- Custom cursor / dragging ghost -->
            <div id="drag-ghost" style="display: none;"></div>
        </div>

        <!-- Render Layer -->
        <canvas id="game-canvas" width="900" height="600"></canvas>
    </div>

    <!-- Scripts -->
    <script src="js/InputManager.js"></script>
    <script src="js/Board.js"></script>
    <script src="js/entities/Entity.js"></script>
    <script src="js/entities/Plant.js"></script>
    <script src="js/entities/Zombie.js"></script>
    <script src="js/entities/Projectile.js"></script>
    <script src="js/entities/Sun.js"></script>
    <script src="js/managers/WaveManager.js"></script>
    <script src="js/managers/CollisionManager.js"></script>
    <script src="js/GameLoop.js"></script>
</body>
</html>
