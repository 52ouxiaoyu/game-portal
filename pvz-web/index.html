<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants vs Zombies - Web Clone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="background-layer"></div>
        <div id="entity-layer"></div>
        
        <!-- UI Layer -->
        <div id="ui-layer">
            <div id="top-bar">
                <div id="sun-bank">
                    <span id="sun-count">50</span>
                </div>
                <div id="seed-bank"></div>
                <div id="shovel-bank">
                    <div id="shovel" class="tool-card"></div>
                </div>
            </div>
            <div id="drag-ghost" style="display: none;"></div>
        </div>
        <!-- Start Menu -->
        <div id="start-menu" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 2000;">
            <img src="assets/images/interface/Logo.png" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none;">
            <div id="start-btn" style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background-image: url('assets/images/interface/SelectorScreen_WoodSign2_32.png'); width: 250px; height: 120px; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 26px; font-weight: bold; transition: transform 0.2s; z-index: 2001;">
                开始游戏
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.getElementById('start-btn').onmouseover = function() { this.style.transform = 'translateX(-50%) scale(1.05)'; };
        document.getElementById('start-btn').onmouseout = function() { this.style.transform = 'translateX(-50%) scale(1)'; };
        
        function resizeGame() {
            const container = document.getElementById('game-container');
            const scaleX = window.innerWidth / 900;
            const scaleY = window.innerHeight / 600;
            const scale = Math.min(scaleX, scaleY);
            container.style.transform = `scale(${scale})`;
            container.style.transformOrigin = 'center center';
            // Store scale for InputManager
            window.gameScale = scale;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();
    </script>
    <script src="js/InputManager.js"></script>
    <script src="js/Board.js"></script>
    <script src="js/entities/Entity.js"></script>
    <script src="js/entities/Plant.js"></script>
    <script src="js/entities/Zombie.js"></script>
    <script src="js/entities/Projectile.js"></script>
    <script src="js/entities/Sun.js"></script>
    <script src="js/managers/WaveManager.js"></script>
    <script src="js/managers/CollisionManager.js"></script>
    <script src="js/GameLoop.js"></script>
</body>
</html>
