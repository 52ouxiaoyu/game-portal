<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六年级英语大闯关</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="grade6_data.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-family: 'Outfit', sans-serif; font-size: 42px; background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .float-back { position: absolute; top: 20px; left: 20px; color: white; text-decoration: none; font-weight: 600; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; }
        
        /* Unit Selection */
        #unit-screen { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .unit-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px 20px; border-radius: 24px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .unit-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); border-color: var(--primary); }
        .unit-card h2 { font-size: 20px; margin-bottom: 10px; }
        .unit-card p { font-size: 14px; color: var(--text-muted); }

        /* Game Screen */
        #game-screen { display: none; flex-direction: column; gap: 24px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .progress-text { font-weight: 600; color: var(--primary); }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; padding: 40px; text-align: center; position: relative; }
        .en-text { font-size: 32px; font-weight: 800; margin-bottom: 20px; line-height: 1.4; }
        .zh-text { font-size: 20px; color: #cbd5e1; margin-bottom: 30px; }
        .tip-box { background: rgba(59,130,246,0.15); border-left: 4px solid var(--primary); padding: 16px; text-align: left; font-size: 15px; color: #94a3b8; border-radius: 0 12px 12px 0; }
        
        .controls { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 20px;}
        button { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px 24px; border-radius: 100px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;}
        button:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); border: none; }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-mic { background: #ef4444; border: none; }
        .btn-mic.recording { animation: pulse 1s infinite; background: #dc2626; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 15px #ef4444; } 100% { transform: scale(1); } }
        
        #feedback { font-size: 18px; font-weight: bold; margin-top: 16px; min-height: 24px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <a href="learning.html" class="float-back">⬅️ 返回学习天地</a>
    <div class="container">
        <header>
            <h1>六年级英语大闯关</h1>
            <p style="color: var(--text-muted); margin-top:10px;">2026版 人教PEP 六年级上册 专属陪练</p>
        </header>

        <div id="unit-screen"></div>

        <div id="game-screen">
            <div class="top-bar">
                <button onclick="backToMenu()">🔙 返回目录</button>
                <div class="progress-text" id="progress">1 / 100</div>
            </div>
            <div class="card">
                <div class="en-text" id="en-text">Amazing landmarks</div>
                <div class="zh-text" id="zh-text">神奇的地标</div>
                <div class="tip-box" id="tip-box">landmark = 地标</div>
                <div id="feedback"></div>
            </div>
            <div class="controls">
                <button onclick="prevItem()">⬅️ 上一个</button>
                <button class="btn-primary" onclick="playAudio()">🔊 原声朗读</button>
                <button class="btn-mic" id="mic-btn" onclick="toggleMic()">🎤 智能跟读</button>
                <button onclick="nextItem()">下一个 ➡️</button>
            </div>
        </div>
    </div>

    <script>
        // 过滤掉没内容的假单元（保留超过20个句子的单元）
        const validUnits = grade6Data.filter(u => u.items && u.items.length > 20);
        let currentUnit = null;
        let currentIndex = 0;

        const synth = window.speechSynthesis;
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        }

        function initMenu() {
            const screen = document.getElementById('unit-screen');
            screen.innerHTML = '';
            validUnits.forEach((unit, idx) => {
                const div = document.createElement('div');
                div.className = 'unit-card';
                div.innerHTML = `<h2>${unit.title.replace('Unit', '第').replace(' ', '单元<br>')}</h2><p>共 ${unit.items.length} 句</p>`;
                div.onclick = () => startUnit(idx);
                screen.appendChild(div);
            });
        }

        function startUnit(idx) {
            currentUnit = validUnits[idx];
            currentIndex = 0;
            document.getElementById('unit-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            renderItem();
        }

        function backToMenu() {
            document.getElementById('unit-screen').style.display = 'grid';
            document.getElementById('game-screen').style.display = 'none';
            if(synth.speaking) synth.cancel();
        }

        function renderItem() {
            if(!currentUnit) return;
            const item = currentUnit.items[currentIndex];
            document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentUnit.items.length}`;
            document.getElementById('en-text').innerText = item.en;
            document.getElementById('zh-text').innerText = item.zh;
            
            const tipBox = document.getElementById('tip-box');
            if(item.tip) {
                tipBox.style.display = 'block';
                tipBox.innerText = item.tip;
            } else {
                tipBox.style.display = 'none';
            }
            document.getElementById('feedback').innerText = '';
        }

        function nextItem() {
            if(currentIndex < currentUnit.items.length - 1) {
                currentIndex++;
                renderItem();
            }
        }

        function prevItem() {
            if(currentIndex > 0) {
                currentIndex--;
                renderItem();
            }
        }

        function playAudio() {
            if(synth.speaking) synth.cancel();
            const text = currentUnit.items[currentIndex].en;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = 0.85; // 放慢语速适合学生
            synth.speak(utter);
        }

        // 语音识别跟读
        let isRecording = false;
        function toggleMic() {
            const micBtn = document.getElementById('mic-btn');
            if(!recognition) {
                alert("当前浏览器不支持语音识别跟读功能，请使用 Chrome 浏览器。");
                return;
            }

            if(isRecording) {
                recognition.stop();
                return;
            }

            try {
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.innerText = '🛑 录音中...';
                document.getElementById('feedback').innerText = '正在听你发音...';
                document.getElementById('feedback').className = '';
            } catch(e) {
                console.error(e);
            }
        }

        if(recognition) {
            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript.toLowerCase();
                const targetText = currentUnit.items[currentIndex].en.toLowerCase().replace(/[^a-z0-9\s]/g, '');
                const spokenClean = speechResult.replace(/[^a-z0-9\s]/g, '');
                
                const fb = document.getElementById('feedback');
                // 简单的包含匹配或词汇命中率
                if(spokenClean.includes(targetText) || targetText.includes(spokenClean)) {
                    fb.innerText = '🌟 Perfect! 发音非常标准！';
                    fb.className = 'success';
                    setTimeout(nextItem, 1500); // 自动下一题
                } else {
                    fb.innerText = `⚠️ 识别到: "${speechResult}"。再试一次吧！`;
                    fb.className = 'error';
                }
            };

            recognition.onend = () => {
                isRecording = false;
                const micBtn = document.getElementById('mic-btn');
                micBtn.classList.remove('recording');
                micBtn.innerText = '🎤 智能跟读';
            };
        }

        // 键盘快捷键绑定
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('game-screen').style.display !== 'flex') return;
            
            if (e.key === 'ArrowLeft') {
                prevItem();
            } else if (e.key === 'ArrowRight') {
                nextItem();
            } else if (e.key === ' ') {
                e.preventDefault(); // 防止空格键使页面滚动
                playAudio();
            }
        });

        initMenu();
    </script>
</body>
</html>
