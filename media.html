<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视听专区 - Media Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --card-radius: 32px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            width: 100%;
        }

        .portal-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: var(--card-radius);
            padding: 60px 40px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .portal-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .card-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .card-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Float Back to Hub */
        .float-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .float-back:hover {
            background: rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="float-back">⬅️ 返回总站首页</a>

    <div class="container">
        <header>
            <h1 class="logo-title">视听专区</h1>
            <div style="color: var(--text-muted); font-size: 18px;">Media Center</div>
        </header>

        <div class="cards-grid">
            <a href="tvbox/index.html" class="portal-card">
                <div class="card-icon">🍿</div>
                <h2 class="card-title">播放视频</h2>
                <p class="card-desc">打开 TVBox Player，直接解析全网高清影视资源，畅享家庭影院体验。</p>
            </a>

            <a href="vip_parse.html" class="portal-card">
                <div class="card-icon">💎</div>
                <h2 class="card-title">VIP 视频解析</h2>
                <p class="card-desc">粘贴腾讯、爱奇艺等视频链接，一键无广告免费观看，原画质极速加载。</p>
            </a>

            <a href="https://www.ximalaya.com/zhubo/52887640" target="_blank" class="portal-card">
                <div class="card-icon">📻</div>
                <h2 class="card-title">播放个人电台</h2>
                <p class="card-desc">前往喜马拉雅收听我的个人电台，享受优质的播客音频内容。</p>
            </a>
        </div>
    </div>
</body>
</html>
