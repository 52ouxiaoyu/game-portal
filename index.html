<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Hub - Personal Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --card-radius: 32px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeDown 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-size: 72px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-subtitle {
            font-size: 20px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 100%;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .portal-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: var(--card-radius);
            padding: 60px 40px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--hover-grad);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 0;
        }

        .portal-card > * {
            position: relative;
            z-index: 1;
        }

        .portal-card.games { --hover-grad: radial-gradient(circle at top right, rgba(239, 68, 68, 0.15), transparent 70%); border-top-color: rgba(239, 68, 68, 0.3); }
        .portal-card.learn { --hover-grad: radial-gradient(circle at top right, rgba(16, 185, 129, 0.15), transparent 70%); border-top-color: rgba(16, 185, 129, 0.3); }
        .portal-card.video { --hover-grad: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 70%); border-top-color: rgba(59, 130, 246, 0.3); }

        .portal-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .portal-card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 72px;
            margin-bottom: 32px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portal-card:hover .card-icon {
            transform: scale(1.1) translateY(-10px);
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .card-desc {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .portal-card:hover .card-desc {
            opacity: 1;
            color: #fff;
        }

        .enter-btn {
            margin-top: auto;
            padding: 12px 32px;
            border-radius: 100px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
            opacity: 0;
            transform: translateY(20px);
        }

        .portal-card:hover .enter-btn {
            opacity: 1;
            transform: translateY(0);
            background: #fff;
            color: #000;
        }

        @media (max-width: 992px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            .portal-card:last-child { grid-column: span 2; }
        }

        @media (max-width: 768px) {
            .logo-title { font-size: 48px; }
            .cards-grid { grid-template-columns: 1fr; gap: 24px; }
            .portal-card:last-child { grid-column: auto; }
            .portal-card { min-height: 280px; padding: 40px 24px; }
            .enter-btn { opacity: 1; transform: translateY(0); margin-top: 32px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="logo-title">NEXUS HUB</h1>
            <div class="logo-subtitle">Select Your Destination</div>
        </header>

        <div class="cards-grid">
            
            <a href="games.html" class="portal-card games">
                <div class="card-icon">🎮</div>
                <h2 class="card-title">游戏中心</h2>
                <p class="card-desc">探索各类网页小游戏，支持双人联机与键盘操作，随时享受街机乐趣。</p>
                <div class="enter-btn">ENTER GAMES</div>
            </a>

            <a href="learning.html" class="portal-card learn">
                <div class="card-icon">📚</div>
                <h2 class="card-title">学习天地</h2>
                <p class="card-desc">专属你的极速背词神器，内置中高考核心词汇，智能过滤，高效记忆。</p>
                <div class="enter-btn">ENTER LEARNING</div>
            </a>

            <a href="tvbox/index.html" class="portal-card video">
                <div class="card-icon">🍿</div>
                <h2 class="card-title">影视专区</h2>
                <p class="card-desc">打开 TVBox Player，直接解析全网高清影视资源，畅享家庭影院体验。</p>
                <div class="enter-btn">ENTER CINEMA</div>
            </a>

        </div>
    </div>

</body>
</html>
